{% set version = "1.42" %}

package:
  name: serpent
  version: {{ version }}

source:
  fn: serpent-{{ version }}.tar.gz
  url: https://pypi.org/packages/source/s/serpent/serpent-{{ version }}.tar.gz
  sha256: 8ea082b01f8ba07ecd74e34a9118ac4521bc4594938d912b808c89f1da425506

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - pip
    - python {{ python_min }}
    - setuptools

  run:
    - python >={{ python_min }}

test:
  requires:
    - python {{ python_min }}
  imports:
    - serpent

about:
  home: https://github.com/irmen/Serpent
  license: MIT
  license_file: LICENSE
  summary: Serialization based on ast.literal_eval

extra:
  recipe-maintainers:
    - irmen
    - whart222
